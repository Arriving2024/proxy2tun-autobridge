name: Tested source release
on:
  push:
    branches: [main]
    paths: [VERSION]
permissions:
  contents: write
concurrency:
  group: source-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned dependency and run PowerShell 5.1 checks
        shell: powershell
        run: |
          $url = 'https://github.com/SagerNet/sing-box/releases/download/v1.14.2/sing-box-1.14.2-windows-amd64.zip'
          Invoke-WebRequest -UseBasicParsing $url -OutFile "$env:RUNNER_TEMP\sing-box.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP\sing-box.zip").Hash -ne 'C2D8BFFF918755808781DFDEEB8581B6C91EB3A243D9A7B55483CFC0C0684D32') { throw 'SHA256 mismatch' }
          Expand-Archive "$env:RUNNER_TEMP\sing-box.zip" "$env:RUNNER_TEMP\sing-box"
          ./tests/Test-All.ps1 -SingBoxPath "$env:RUNNER_TEMP\sing-box\sing-box-1.14.2-windows-amd64\sing-box.exe"
      - name: Build and verify source-only assets
        shell: powershell
        run: |
          $version = (Get-Content ./VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          ./tools/Build-Release.ps1 -Version "v$version" -OutputDirectory "$env:RUNNER_TEMP\release"
      - name: Publish experimental release at tested commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const version = fs.readFileSync('VERSION', 'utf8').trim();
            const tag = `v${version}`;
            const body = fs.readFileSync('RELEASE_NOTES.md', 'utf8');
            const {owner, repo} = context.repo;
            // Never overwrite an existing release or tag.
            try {
              await github.rest.repos.getReleaseByTag({owner, repo, tag});
              throw new Error(`Release ${tag} already exists`);
            } catch (e) { if (e.status !== 404) throw e; }
            try {
              await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
              throw new Error(`Tag ${tag} already exists`);
            } catch (e) { if (e.status !== 404) throw e; }
            const {data: release} = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: context.sha,
              name: `Proxy2TUN AutoBridge ${tag} (Experimental)`, body,
              draft: true, prerelease: true
            });
            const folder = path.join(process.env.RUNNER_TEMP, 'release');
            const expected = [
              `Proxy2TUN-AutoBridge-${tag}-windows-x64-source.zip`,
              `Proxy2TUN-AutoBridge-${tag}-windows-x64-source.manifest.json`,
              'SHA256SUMS.txt'
            ];
            for (const name of expected) {
              const data = fs.readFileSync(path.join(folder, name));
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data,
                headers: {'content-type': name.endsWith('.zip') ? 'application/zip' : 'text/plain', 'content-length': data.length}
              });
            }
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id, draft: false, prerelease: true});
            core.notice(release.html_url);
